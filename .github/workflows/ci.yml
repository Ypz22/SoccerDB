name: CI SoccerDB

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: soccer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: soccer_test

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        working-directory: backend
        run: npm install

      - name: 🛠️ Create database schema
        working-directory: backend
        run: |
          psql postgresql://postgres:postgres@localhost:5432/soccer_test < querys.sql

      - name: 🧪 Run backend tests
        working-directory: backend
        run: npm test

      - name: Coverage Test
        working-directory: backend
        run: npm run test -- --coverage 

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🧪 Run frontend tests (Karma + Jasmine)
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: 🧪 Run frontend tests (coverage)
        run: npm run test -- --watch=false --browsers=ChromeHeadless --coverage


      - name: 🏗️ Build frontend
        run: npm run build



        